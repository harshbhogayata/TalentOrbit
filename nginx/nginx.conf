upstream talentorbit_web {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 60M;  # Allow 50MB videos + overhead

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://talentorbit_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
