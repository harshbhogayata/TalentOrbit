# =============================================================================
# TalentOrbit — Docker Compose (Production)
# =============================================================================
# Services: Django (Gunicorn) + PostgreSQL
# Usage:
#   docker-compose up -d --build
#   docker-compose exec web python manage.py migrate
#   docker-compose exec web python manage.py createsuperuser
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentorbit
      POSTGRES_USER: talentorbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U talentorbit" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://talentorbit:${POSTGRES_PASSWORD:-changeme}@db:5432/talentorbit
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - log_data:/app/logs

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  static_data:
  log_data:
