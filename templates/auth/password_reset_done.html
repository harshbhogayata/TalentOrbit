{% extends 'base.html' %}
{% block title %}Password Reset Sent{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="glass-card text-center" style="padding: 2rem;">
        <i class="bi bi-envelope-check" style="font-size: 3rem; color: var(--success);"></i>
        <h2 style="font-weight: 800; margin-top: 1rem;">Check Your Email</h2>
        <p style="color: var(--text-muted);">
            If an account exists with that email address, we've sent password reset instructions.
        </p>
        <a href="{% url 'login' %}" class="btn btn-glass mt-3">Back to Login</a>
    </div>
</div>
{% endblock %}
