{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="glass-card text-center" style="padding: 2rem;">
        <i class="bi bi-check-circle" style="font-size: 3rem; color: var(--success);"></i>
        <h2 style="font-weight: 800; margin-top: 1rem;">Password Reset!</h2>
        <p style="color: var(--text-muted);">Your password has been set. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-primary-gradient mt-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Log In
        </a>
    </div>
</div>
{% endblock %}
