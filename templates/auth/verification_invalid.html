{% extends 'base.html' %}
{% block title %}Verification Failed{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card fade-in" style="max-width: 500px;">
        <div class="text-center">
            <i class="bi bi-x-circle" style="font-size: 3.5rem; color: var(--danger, #f87171);"></i>
            <h2 style="font-weight: 800; margin-top: 1rem;">Verification Failed</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">
                This verification link is invalid or has expired.
            </p>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Please log in and request a new verification email.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary-gradient mt-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
