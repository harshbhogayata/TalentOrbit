{% extends 'base.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container">
    <div class="text-center py-5" style="max-width: 500px; margin: 0 auto;">
        <div style="font-size: 8rem; font-weight: 800; font-family: var(--font-heading); line-height: 1; background: var(--gradient-cool); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
            500
        </div>
        <h2 style="font-family: var(--font-heading); font-weight: 700; margin-bottom: 1rem;">Something Went Wrong</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
            We're experiencing technical difficulties. Please try again later.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary-gradient">
            <i class="bi bi-house me-2"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
